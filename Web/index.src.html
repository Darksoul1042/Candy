<title>Pétalo Pop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--bg:#fdf3f0;--panel:#ffffff;--fg:#3a2430;--muted:#8a6f7b;--accent:#e8486a;--accent-fg:#fff;--line:#f0d9d6;--board:#f6e3df;--cell:#fbeeea;--good:#3e9e5a;--shadow:0 2px 10px rgba(120,50,70,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1219;--panel:#2a1a24;--fg:#f7e6ea;--muted:#b9979f;--accent:#ff6b8b;--accent-fg:#2a0f18;--line:#43283a;--board:#2f1c28;--cell:#3a2432;--good:#5fd17f;--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1219;--panel:#2a1a24;--fg:#f7e6ea;--muted:#b9979f;--accent:#ff6b8b;--accent-fg:#2a0f18;--line:#43283a;--board:#2f1c28;--cell:#3a2432;--good:#5fd17f;--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:'Baloo 2',system-ui,sans-serif;font-size:16px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:1.7rem;line-height:1.1;font-weight:800;color:var(--accent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.btn{background:var(--accent);color:var(--accent-fg);border-radius:14px;padding:8px 18px;font-weight:700;box-shadow:var(--shadow)}
.btn.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.icon{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;font-size:1.1rem}
.sub{color:var(--muted);font-size:.9rem;margin:0}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:var(--shadow);min-width:0}
.lv b{font-size:1.25rem;line-height:1.2}
.lv span{font-size:.8rem;letter-spacing:1px;color:#f2b01e;height:1.1em}
.lv[disabled]{opacity:.45;box-shadow:none}
#hud{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 12px;box-shadow:var(--shadow)}
.stat{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.stat b{font-size:1.3rem}
.stat small{color:var(--muted);font-size:.8rem;display:block;line-height:1}
#bar{position:relative;height:12px;border-radius:8px;background:var(--cell);overflow:hidden}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:8px;transition:width .3s}
#bar i{position:absolute;top:0;bottom:0;width:2px;background:var(--panel);opacity:.9}
#objs{display:flex;gap:6px;flex-wrap:wrap}
.obj{display:flex;align-items:center;gap:6px;background:var(--cell);border-radius:10px;padding:2px 10px;font-weight:700;font-size:.95rem}
.obj.done{background:var(--good);color:#fff}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
#stage{position:relative}
canvas{display:block;width:100%;aspect-ratio:1;border-radius:18px;background:var(--board);touch-action:none;box-shadow:var(--shadow)}
#boosters{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bo{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;font-size:.72rem;line-height:1.1;position:relative;min-width:0;box-shadow:var(--shadow)}
.bo em{font-style:normal;font-size:1.3rem;line-height:1.2}
.bo .n{position:absolute;top:-6px;right:-2px;background:var(--accent);color:var(--accent-fg);border-radius:10px;min-width:20px;font-weight:800;font-size:.8rem;padding:0 4px}
.bo.on{outline:3px solid var(--accent)}
.bo[disabled]{opacity:.4}
#msg{min-height:1.3em;text-align:center;color:var(--muted);font-size:.9rem;margin:0}
#end,#intro{position:absolute;inset:0;background:rgba(30,10,20,.55);border-radius:18px;display:flex;align-items:center;justify-content:center;padding:16px}
#end>div,#intro>div{background:var(--panel);border-radius:20px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;max-width:300px}
#end h2,#intro h2{margin:0;font-size:1.6rem}
#stars{font-size:2rem;color:#f2b01e;letter-spacing:4px}
.note{font-size:.75rem;color:var(--muted);text-align:center;margin:0}
</style>
<div id="app">
 <section id="menu">
  <div class="row"><h1>Pétalo Pop</h1><button class="icon" id="snd1" aria-label="Sonido">🔊</button></div>
  <p class="sub" style="margin:2px 0 10px">Une 3 o más pétalos. 30 niveles originales.</p>
  <div id="grid"></div>
  <p class="note" style="margin-top:12px">Prototipo web del proyecto Unity «PetaloPop». Mismo núcleo de reglas, verificado contra la versión C#.</p>
 </section>
 <section id="game" hidden style="display:flex;flex-direction:column;gap:10px">
  <div class="row"><button class="icon" id="back" aria-label="Menú">☰</button><b id="ltitle" style="font-size:1.2rem">Nivel 1</b><button class="icon" id="snd2" aria-label="Sonido">🔊</button></div>
  <div id="hud">
   <div class="stat"><div><small>Movimientos</small><b id="moves">0</b></div><div><small>Puntos</small><b id="score">0</b></div><div><small>Meta</small><b id="target">0</b></div></div>
   <div id="bar"><div id="fill"></div></div>
   <div id="objs"></div>
  </div>
  <div id="stage"><canvas id="cv" role="img" aria-label="Tablero de juego"></canvas>
   <div id="intro" hidden><div><h2 id="ititle"></h2><div id="igoal" class="sub" style="text-align:left"></div><button class="btn" id="iplay">Jugar</button></div></div>
   <div id="end" hidden><div><h2 id="etitle"></h2><div id="stars"></div><div id="etext" class="sub"></div>
    <div class="row" style="gap:8px"><button class="btn ghost" id="emenu">Menú</button><button class="btn ghost" id="eretry">Reintentar</button><button class="btn" id="enext">Siguiente</button></div></div></div>
  </div>
  <p id="msg"></p>
  <div id="boosters"></div>
 </section>
</div>
<script>
/*CORE*/
</script>
<script>
(function(){
'use strict';
const C=window.PetaloCore,{P,SK,Obj,Booster}=C;
const $=id=>document.getElementById(id);
const COLORS=['#ef5b6c','#f5a623','#4fb86a','#3f8fe0','#9b59d0','#ec6bb0'];
const KEY='petalopop.web.v1';
const GIFT={0:3,1:2,2:2,3:2,4:2};
const BO=[[Booster.Hammer,'🔨','Martillo'],[Booster.FreeSwap,'🔄','Cambio'],[Booster.ObstacleRemover,'🧹','Limpiar'],[Booster.ExtraMoves,'➕','+5'],[Booster.SpecialMaker,'💣','Bomba']];
// ------------------------------------------------------------ guardado (localStorage tolerante)
function defSave(){return{unlocked:1,stars:Array(30).fill(0),best:Array(30).fill(0),inv:Object.assign({},GIFT),sound:true}}
const clampInt=(v,lo,hi,d)=>{v=Number(v);return Number.isFinite(v)?Math.min(hi,Math.max(lo,Math.trunc(v))):d};
function sanitize(s){const d=defSave();if(!s||typeof s!=='object')return d;
 d.unlocked=clampInt(s.unlocked,1,30,1);
 for(let i=0;i<30;i++){d.stars[i]=clampInt(Array.isArray(s.stars)?s.stars[i]:0,0,3,0);d.best[i]=clampInt(Array.isArray(s.best)?s.best[i]:0,0,1e9,0)}
 if(s.inv&&typeof s.inv==='object')for(let k=0;k<5;k++)if(k in s.inv)d.inv[k]=clampInt(s.inv[k],0,99,GIFT[k]);
 d.sound=s.sound!==false;
 for(let i=0;i<30;i++)if(d.stars[i]>0&&d.unlocked<Math.min(30,i+2))d.unlocked=Math.min(30,i+2);
 return d}
let save=(function(){try{return sanitize(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){}return defSave()})();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
// ------------------------------------------------------------ audio (tras la primera interacción)
let actx=null;
function beep(f,d,type,v,delay){if(!save.sound)return;try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime+(delay||0),o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d)}catch(e){}}
function vib(ms){try{if(save.sound&&navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
const sfx={swap:()=>beep(330,.08,'triangle'),bad:()=>beep(150,.15,'sawtooth',.05),pop:c=>beep(420+60*Math.min(c,6),.12,'sine',.09),special:()=>{vib(25);beep(600,.15,'square',.05);beep(900,.2,'square',.04,.08)},win:()=>{vib([60,40,60]);[523,659,784,1046].forEach((f,i)=>beep(f,.25,'triangle',.09,i*.12))},lose:()=>[330,262,196].forEach((f,i)=>beep(f,.3,'sine',.08,i*.15))};
function setSound(on){save.sound=on;persist();$('snd1').textContent=$('snd2').textContent=on?'🔊':'🔇'}
// ------------------------------------------------------------ menú
function buildMenu(){const g=$('grid');g.innerHTML='';for(let l=1;l<=30;l++){const b=document.createElement('button');b.className='lv';const s=save.stars[l-1];b.innerHTML='<b>'+l+'</b><span>'+(l>save.unlocked?'🔒':'★'.repeat(s)+'☆'.repeat(3-s))+'</span>';b.disabled=l>save.unlocked;b.onclick=()=>startLevel(l);g.appendChild(b)}}
function show(game){$('menu').hidden=game;$('game').hidden=!game;$('game').style.display=game?'flex':'none';if(game)resize()}
// ------------------------------------------------------------ estado de partida
const cv=$('cv'),ctx=cv.getContext('2d');
let gen=0,S=null,level=1,W=0,H=0,cs=0,view=[],jv=[],busy=false,armed=null,pending=null,sel=null,idleAt=0,parts=[],cssv={};
const now=()=>performance.now();
function mkTile(t,sp,hp,x,y){return{t,sp,hp,x,y,a:null,dying:0,sc:1,pulse:0}}
function syncView(){view=[];jv=[];for(let x=0;x<W;x++){view.push([]);jv.push([]);for(let y=0;y<H;y++){const p=P(x,y),t=S.board.get(p);view[x].push(t?mkTile(t,S.board.special(p),S.board.hp(p),x,y):null);jv[x].push(S.board.jelly(p))}}}
function toMenu(){gen++;S=null;busy=false;armed=null;pending=null;sel=null;buildMenu();show(false)}
function startLevel(l){gen++;level=l;S=new C.GameSession(C.getLevel(l),save.inv);// el inventario se consume sobre save.inv
 S.boosters=save.inv;W=S.board.width;H=S.board.height;busy=false;armed=null;pending=null;sel=null;idleAt=now();parts=[];$('end').hidden=true;$('intro').hidden=true;$('ltitle').textContent='Nivel '+l;
 syncView();buildTargetMarks();hud();boosterBar();msg('Desliza un pétalo hacia un vecino.');show(true);showIntro()}
const SHAPES=['círculos','rombos','cuadrados','triángulos','hexágonos','estrellas'];
function showIntro(){const T=S.config.targetScore;let h='<div>• Consigue <b>'+T+'</b> puntos en <b>'+S.movesLeft+'</b> movimientos.</div>';
 for(const it of S.objectives){const k=it.spec.kind;h+='<div>• '+(k===Obj.CollectType?'Recoge <b>'+it.target+'</b> '+SHAPES[it.spec.type-1]+' ('+'<span class="dot" style="background:'+COLORS[it.spec.type-1]+'"></span>)':k===Obj.ClearJelly?'Limpia <b>toda la gelatina</b> ('+it.target+' casillas)':k===Obj.BreakFrozen?'Rompe <b>todo el hielo</b> ('+it.target+')':'Destruye <b>todas las cajas</b> ('+it.target+')')+'</div>'}
 $('ititle').textContent='Nivel '+level;$('igoal').innerHTML=h;$('intro').hidden=false}
function msg(t){$('msg').textContent=t}
const OBJ_TXT={[Obj.ClearJelly]:'Gelatina',[Obj.BreakFrozen]:'Hielo',[Obj.DestroyCrates]:'Cajas'};
function buildTargetMarks(){const bar=$('bar');bar.querySelectorAll('i').forEach(e=>e.remove());[1,1.5,2].forEach(m=>{const i=document.createElement('i');i.style.left=(100*m/2)+'%';bar.appendChild(i)})}
function hud(){if(!S)return;const T=S.config.targetScore;$('moves').textContent=S.movesLeft;$('moves').style.color=S.movesLeft<=5?'var(--accent)':'';$('score').textContent=S.score;$('target').textContent=T;$('fill').style.width=Math.min(100,100*S.score/(2*T))+'%';
 const o=$('objs');o.innerHTML='';for(const it of S.objectives){const d=document.createElement('div');const done=it.current>=it.target;d.className='obj'+(done?' done':'');const cur=Math.min(it.current,it.target);
  d.innerHTML=(it.spec.kind===Obj.CollectType?'<span class="dot" style="background:'+COLORS[it.spec.type-1]+'"></span>':OBJ_TXT[it.spec.kind]+' ')+cur+'/'+it.target;o.appendChild(d)}}
function boosterBar(){if(!S)return;const b=$('boosters');b.innerHTML='';for(const[k,ic,name]of BO){const e=document.createElement('button');const n=S.count(k);e.className='bo'+(armed&&armed.k===k?' on':'');e.disabled=n<=0||busy||S.state!=='Playing';e.innerHTML='<em>'+ic+'</em>'+name+'<span class="n">'+n+'</span>';e.onclick=()=>pickBooster(k);b.appendChild(e)}}
function pickBooster(k){if(busy||S.state!=='Playing')return;if(k===Booster.ExtraMoves){run(()=>S.useExtraMoves());return}
 armed=armed&&armed.k===k?null:{k};pending=null;sel=null;boosterBar();msg(armed?(k===Booster.FreeSwap?'Cambio libre: toca dos pétalos vecinos.':'Toca el objetivo.'):'')}
// ------------------------------------------------------------ animación de pasos
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function go(tile,tx,ty,dur){tile.a={fx:tile.x,fy:tile.y,tx,ty,t0:now(),dur}}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=1.5+Math.random()*3.5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col})}}
const ABORT={};
async function play(steps){const g0=gen;const W=async ms=>{await wait(ms);if(g0!==gen)throw ABORT};
 for(const st of steps){
  if(st.kind==='Swap'||st.kind==='SwapBack'){const a=view[st.a.x][st.a.y],b=view[st.b.x][st.b.y];sfx.swap();
   if(a)go(a,st.b.x,st.b.y,140);if(b)go(b,st.a.x,st.a.y,140);view[st.a.x][st.a.y]=b;view[st.b.x][st.b.y]=a;await W(150);
   if(st.kind==='SwapBack'){sfx.bad()}}
  else if(st.kind==='Clear'){
   for(const p of st.cleared){const t=view[p.x][p.y];if(t){t.dying=now();burst(p.x,p.y,COLORS[t.t-1]||'#a07850',4);view[p.x][p.y]=null;dead.push(t)}}
   for(const c of st.created){const t=view[c.pos.x][c.pos.y];if(t){t.sp=c.kind;t.pulse=now()}}
   if(st.points>0&&st.cleared.length){let cx=0,cy=0;for(const p of st.cleared){cx+=p.x;cy+=p.y}pops.push({txt:'+'+st.points+(st.cascade>1?'  x'+st.cascade:''),x:cx/st.cleared.length,y:cy/st.cleared.length,t0:now()})}
   if(st.activated.length||st.created.length)sfx.special();else sfx.pop(st.cascade);
   for(const h of st.hits){if(h.kind==='Jelly')jv[h.pos.x][h.pos.y]=h.remaining;else{const t=view[h.pos.x][h.pos.y];if(t){t.hp=h.remaining;t.pulse=now()}}}
   hud();await W(210)}
  else if(st.kind==='Fall'||st.kind==='Spawn'||st.kind==='Shuffle'){
   const tiles=[];for(const m of st.moves){let t;if(st.kind==='Spawn')t=mkTile(m.type,0,0,m.from.x,m.from.y);else{t=view[m.from.x][m.from.y];if(st.kind==='Fall')view[m.from.x][m.from.y]=null}tiles.push([t,m])}
   if(st.kind==='Shuffle')for(const[,m]of tiles)view[m.from.x][m.from.y]=null;
   let md=0;for(const[t,m]of tiles){if(!t)continue;view[m.to.x][m.to.y]=t;const d=Math.hypot(m.to.x-t.x,m.to.y-t.y);md=Math.max(md,d);go(t,m.to.x,m.to.y,st.kind==='Shuffle'?350:110+60*d)}
   if(st.kind==='Shuffle')msg('Sin movimientos: tablero mezclado.');
   await W(md?Math.min(600,130+60*md):0)}
 }
}
let dead=[],pops=[];
async function run(fn){if(busy||!S)return;const g0=gen;busy=true;msg('');boosterBar();const r=fn();idleAt=now();
 if(!r.accepted&&!r.steps.length){busy=false;boosterBar();return false}
 try{await play(r.steps)}catch(e){if(e===ABORT)return false;throw e}
 if(g0!==gen)return false;syncView();hud();busy=false;idleAt=now();if(r.accepted)persist();
 if(r.accepted&&r.pointsGained>0&&r.maxCascade>1)msg('¡Cascada x'+r.maxCascade+'! +'+r.pointsGained);else if(r.accepted&&r.pointsGained>0)msg('+'+r.pointsGained);
 if(S.state!=='Playing')finish();else boosterBar();return r.accepted}
function finish(){const g0=gen;boosterBar();const T=S.config.targetScore;const won=S.state==='Won';
 if(won){const st=S.stars;save.stars[level-1]=Math.max(save.stars[level-1],st);save.best[level-1]=Math.max(save.best[level-1],S.score);if(level<30)save.unlocked=Math.max(save.unlocked,level+1);
  const rk=BO[level%5][0];save.inv[rk]=(save.inv[rk]||0)+1;persist();sfx.win();
  $('etitle').textContent='¡Nivel superado!';$('stars').textContent='★'.repeat(st)+'☆'.repeat(3-st);$('etext').textContent=S.score+' puntos · premio: 1 '+BO[level%5][2];$('enext').hidden=level>=30}
 else{persist();sfx.lose();$('etitle').textContent='Sin movimientos';$('stars').textContent='☆☆☆';$('etext').textContent=S.score<T?'Te faltaron '+(T-S.score)+' puntos.':'Faltó completar los objetivos.';$('enext').hidden=true}
 setTimeout(()=>{if(g0===gen)$('end').hidden=false},350)}
// ------------------------------------------------------------ entrada
function cellAt(ev){const r=cv.getBoundingClientRect();const x=Math.floor((ev.clientX-r.left)/r.width*W),y=H-1-Math.floor((ev.clientY-r.top)/r.height*H);return(x>=0&&y>=0&&x<W&&y<H)?P(x,y):null}
let down=null;
cv.addEventListener('pointerdown',e=>{if(busy||S.state!=='Playing')return;const p=cellAt(e);if(!p)return;down={p,x:e.clientX,y:e.clientY,done:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}idleAt=now()});
cv.addEventListener('pointermove',e=>{if(!down||down.done||busy)return;const dx=e.clientX-down.x,dy=e.clientY-down.y,th=cv.getBoundingClientRect().width/W*.35;
 if(Math.hypot(dx,dy)<th)return;down.done=true;let d=Math.abs(dx)>Math.abs(dy)?P(Math.sign(dx),0):P(0,-Math.sign(dy));trySwap(down.p,P(down.p.x+d.x,down.p.y+d.y))});
cv.addEventListener('pointerup',e=>{if(down&&!down.done&&!busy)tap(down.p);down=null});
cv.addEventListener('pointercancel',()=>{down=null});
const adj=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y)===1;
function trySwap(a,b){if(!S.board.inBounds(b))return;sel=null;if(armed&&armed.k===Booster.FreeSwap){freeSwap(a,b);return}run(()=>S.trySwap(a,b))}
function freeSwap(a,b){armed=null;pending=null;run(()=>S.useFreeSwap(a,b)).then(()=>{boosterBar()})}
function tap(p){
 if(armed){const k=armed.k;
  if(k===Booster.FreeSwap){if(!pending){pending=p;sel=p;msg('Ahora toca un vecino.');return}if(!adj(pending,p)){pending=p;sel=p;return}const a=pending;pending=null;sel=null;freeSwap(a,p);return}
  armed=null;sel=null;boosterBar();
  const f=k===Booster.Hammer?()=>S.useHammer(p):k===Booster.ObstacleRemover?()=>S.useObstacleRemover(p):()=>S.useSpecialMaker(p,SK.Bomb);
  run(f).then(ok=>{if(ok===false)msg('Ahí no se puede usar.')});return}
 if(!S.board.isMovable(p)){sel=null;return}
 if(sel&&adj(sel,p)){const a=sel;sel=null;run(()=>S.trySwap(a,p));return}
 sel=p}
// ------------------------------------------------------------ dibujo
function shape(c,t,cx,cy,r){c.beginPath();switch(t){
 case 1:c.arc(cx,cy,r,0,6.283);break;
 case 2:c.moveTo(cx,cy-r*1.1);c.lineTo(cx+r*1.05,cy);c.lineTo(cx,cy+r*1.1);c.lineTo(cx-r*1.05,cy);c.closePath();break;
 case 3:rr(c,cx-r*.9,cy-r*.9,r*1.8,r*1.8,r*.4);break;
 case 4:c.moveTo(cx,cy-r);c.lineTo(cx+r*1.05,cy+r*.8);c.lineTo(cx-r*1.05,cy+r*.8);c.closePath();break;
 case 5:for(let i=0;i<6;i++){const a=i*Math.PI/3+Math.PI/6;c.lineTo(cx+Math.cos(a)*r*1.05,cy+Math.sin(a)*r*1.05)}c.closePath();break;
 default:for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rad=i%2?r*.5:r*1.12;c.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad)}c.closePath()}}
function rr(c,x,y,w,h,r){c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function px(x){return x*cs}function py(y){return(H-1-y)*cs}
function drawTile(t,tm){const cx=px(t.x)+cs/2,cy=py(t.y)+cs/2;let sc=t.sc,al=1;
 if(t.dying){const k=Math.min(1,(tm-t.dying)/200);sc=1-k;al=1-k;if(k>=1)return}
 if(t.pulse){const k=(tm-t.pulse)/300;if(k<1)sc*=1+.25*Math.sin(k*Math.PI)}
 if(sel&&!t.dying&&Math.round(t.x)===sel.x&&Math.round(t.y)===sel.y)sc*=1.12+.05*Math.sin(tm/120);
 ctx.save();ctx.globalAlpha=al;ctx.translate(cx,cy);ctx.scale(sc,sc);const r=cs*.34;
 if(t.t===C.CRATE){ctx.fillStyle='#a8743c';ctx.beginPath();rr(ctx,-cs*.4,-cs*.4,cs*.8,cs*.8,cs*.1);ctx.fill();ctx.strokeStyle='#6e4520';ctx.lineWidth=cs*.05;ctx.stroke();ctx.beginPath();ctx.moveTo(-cs*.4,-cs*.4);ctx.lineTo(cs*.4,cs*.4);ctx.moveTo(cs*.4,-cs*.4);ctx.lineTo(-cs*.4,cs*.4);ctx.stroke();ctx.fillStyle='#fff';ctx.font='800 '+cs*.3+'px Baloo 2,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle='#6e4520';ctx.lineWidth=cs*.06;ctx.strokeText(t.hp,0,cs*.02);ctx.fillText(t.hp,0,cs*.02)}
 else if(t.t===C.STONE){ctx.fillStyle='#7f8794';ctx.beginPath();rr(ctx,-cs*.42,-cs*.42,cs*.84,cs*.84,cs*.3);ctx.fill();ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.arc(-cs*.12,-cs*.14,cs*.12,0,6.283);ctx.fill()}
 else{const col=COLORS[t.t-1];shape(ctx,t.t,0,0,r);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=cs*.04;ctx.strokeStyle='rgba(0,0,0,.25)';ctx.stroke();
  ctx.beginPath();ctx.arc(-r*.3,-r*.35,r*.22,0,6.283);ctx.fillStyle='rgba(255,255,255,.45)';ctx.fill();
  if(t.sp)special(t.sp,r,tm);
  if(t.hp>0){ctx.fillStyle='rgba(170,225,255,'+(.35+.12*t.hp)+')';ctx.strokeStyle='#e9f8ff';ctx.lineWidth=cs*.05;ctx.beginPath();rr(ctx,-cs*.43,-cs*.43,cs*.86,cs*.86,cs*.14);ctx.fill();ctx.stroke();if(t.hp>1){ctx.beginPath();rr(ctx,-cs*.34,-cs*.34,cs*.68,cs*.68,cs*.1);ctx.stroke()}}}
 ctx.restore()}
function special(k,r,tm){ctx.save();ctx.lineWidth=cs*.06;ctx.strokeStyle='#fff';ctx.fillStyle='#fff';
 if(k===SK.LineH||k===SK.LineV){if(k===SK.LineV)ctx.rotate(Math.PI/2);for(const d of[-1,1]){ctx.beginPath();ctx.moveTo(d*r*.25,0);ctx.lineTo(d*r*1.15,0);ctx.stroke();ctx.beginPath();ctx.moveTo(d*r*1.25,0);ctx.lineTo(d*r*.85,-r*.3);ctx.lineTo(d*r*.85,r*.3);ctx.closePath();ctx.fill()}}
 else if(k===SK.Bomb){ctx.beginPath();ctx.arc(0,0,r*.55+Math.sin(tm/200)*r*.05,0,6.283);ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*.2,0,6.283);ctx.fill()}
 else{ctx.rotate(tm/700);for(let i=0;i<6;i++){ctx.rotate(Math.PI/3);ctx.fillStyle='hsl('+(i*60)+',90%,60%)';ctx.beginPath();ctx.arc(r*.55,0,r*.28,0,6.283);ctx.fill();ctx.stroke()}}
 ctx.restore()}
function draw(){requestAnimationFrame(draw);if(!S||$('game').hidden)return;const tm=now();
 ctx.clearRect(0,0,cv.width,cv.height);ctx.save();ctx.scale(cv.width/(cs*W||1),cv.width/(cs*W||1));
 for(let x=0;x<W;x++)for(let y=0;y<H;y++){ctx.fillStyle=cssv.cell;ctx.globalAlpha=(x+y)%2?.55:.85;ctx.beginPath();rr(ctx,px(x)+cs*.04,py(y)+cs*.04,cs*.92,cs*.92,cs*.16);ctx.fill();ctx.globalAlpha=1;
  const j=jv[x]&&jv[x][y];if(j>0){ctx.fillStyle=j>1?'rgba(235,90,170,.55)':'rgba(255,150,205,.45)';ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=cs*.04;ctx.beginPath();rr(ctx,px(x)+cs*.02,py(y)+cs*.02,cs*.96,cs*.96,cs*.18);ctx.fill();ctx.stroke()}}
 // pista tras 6 s sin actividad
 let hint=null;if(!busy&&S.state==='Playing'&&tm-idleAt>6000)hint=S.hint();
 const all=[];for(let x=0;x<W;x++)for(let y=0;y<H;y++)if(view[x]&&view[x][y])all.push(view[x][y]);
 for(const t of dead)all.push(t);
 for(const t of all){if(t.a){const k=Math.min(1,(tm-t.a.t0)/t.a.dur),e=ease(k);t.x=t.a.fx+(t.a.tx-t.a.fx)*e;t.y=t.a.fy+(t.a.ty-t.a.fy)*e;if(k>=1){t.x=t.a.tx;t.y=t.a.ty;t.a=null}}}
 dead=dead.filter(t=>tm-t.dying<220);
 for(const t of all){if(hint&&!t.dying&&((Math.round(t.x)===hint.from.x&&Math.round(t.y)===hint.from.y)||(Math.round(t.x)===hint.to.x&&Math.round(t.y)===hint.to.y))){const s=1+.08*Math.sin(tm/160);t.sc=s}else t.sc=1;drawTile(t,tm)}
 parts=parts.filter(p=>p.life>0);for(const p of parts){p.x+=p.vx*.016;p.y+=p.vy*.016;p.vy-=.05;p.life-=.035;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(px(p.x)+cs/2,py(0)+cs/2-(p.y)*cs,cs*.06,0,6.283);ctx.fill()}
 pops=pops.filter(q=>tm-q.t0<900);for(const q of pops){const k=(tm-q.t0)/900;ctx.globalAlpha=1-k*k;ctx.font='800 '+cs*.42+'px Baloo 2,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const X=px(q.x)+cs/2,Y=py(q.y)+cs/2-k*cs*.9;ctx.lineWidth=cs*.1;ctx.strokeStyle='rgba(60,20,40,.85)';ctx.strokeText(q.txt,X,Y);ctx.fillStyle='#fff';ctx.fillText(q.txt,X,Y);ctx.globalAlpha=1}
 ctx.restore()}
function resize(){if(!S)return;const w=cv.clientWidth||320,dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr);cs=cv.width/W/dpr*dpr;readCss()}
function readCss(){const s=getComputedStyle(document.documentElement);cssv.cell=s.getPropertyValue('--cell').trim()||'#fbeeea'}
window.addEventListener('resize',resize);
if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readCss)}catch(e){}

setSound(save.sound);buildMenu();show(false);readCss();requestAnimationFrame(draw);
window.__petalo={get S(){return S},startLevel,run,play,get busy(){return busy},get save(){return save},C};
