# Compila el APK de Android en la nube con GameCI (no hace falta instalar Unity en tu equipo).
# NO se ha podido ejecutar desde el entorno donde se escribió: es la configuración estándar de GameCI, sin probar.
# Requisitos (una sola vez): ver Docs/COMO_COMPILAR.md -> secretos UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD.
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.40f1
          buildMethod: PetaloPop.EditorTools.BuildScript.BuildAndroid
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        with:
          name: PetaloPop-apk
          path: Build/PetaloPop.apk
          if-no-files-found: error
