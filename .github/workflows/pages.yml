# Publica el prototipo web en GitHub Pages en cada cambio de Web/.
name: pages
on: { workflow_dispatch: {}, push: { paths: ['Web/**', '.github/workflows/pages.yml'] } }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd Web && node build.js && mkdir -p ../site && cp test.html ../site/index.html
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
