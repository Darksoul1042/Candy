# APK del prototipo web (WebView). No necesita licencia de Unity. SIN PROBAR en CI real.
name: build-web-apk
on: { workflow_dispatch: {}, push: { paths: ['Web/**', 'Android/**'] } }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Generar HTML y copiarlo a assets
        run: |
          cd Web && node build.js && cd ..
          mkdir -p Android/app/src/main/assets
          cp Web/test.html Android/app/src/main/assets/index.html
      - name: Compilar APK debug
        run: gradle -p Android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: PetaloPopWeb-debug-apk, path: Android/app/build/outputs/apk/debug/app-debug.apk }
